<div class="app-layout">
  <!-- Top Navigation Bar -->
  <header class="app-navbar">
    <div class="nav-container">
      <div class="nav-brand">
        <a routerLink="/requests" class="brand-link">
          <span class="brand-icon">✓</span>
          <span class="brand-text">ApprovalFlow</span>
        </a>
      </div>

      <nav class="nav-links">
        <a routerLink="/requests" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
          Requests
        </a>
        <a routerLink="/requests/create" routerLinkActive="active" class="nav-item nav-btn">
          + New Request
        </a>
      </nav>
    </div>
  </header>

  <!-- Main View Area -->
  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <div class="footer-container">
      <p>Approval Request Management System &bull; Clean Architecture &bull; In-Memory</p>
    </div>
  </footer>
</div>
